name: ML notebook structure and syntax
on:
  push:
    branches: [main]
  pull_request:
jobs:
  notebook-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook parser
        run: python -m pip install "ipython>=8" "nbformat>=5" ruff pytest numpy pandas scikit-learn
      - name: Static lint (undefined names and unused imports)
        run: ruff check --select F scripts
      - name: Validate notebook JSON and syntax
        run: python scripts/check_notebooks.py
      - name: Synthetic tests for published poster protocol
        run: python -m pytest -q tests/
