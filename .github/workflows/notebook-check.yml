name: ML notebook structure and syntax
on:
  push:
    branches: [main]
  pull_request:
jobs:
  notebook-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install notebook parser
        run: python -m pip install "ipython>=8" "nbformat>=5"
      - name: Validate notebook JSON and syntax
        run: python scripts/check_notebooks.py
